  <circle cx="1180" cy="424" r="4" fill="#E8954C" opacity="0.8"/>
  <circle cx="1187" cy="436" r="3" fill="#E8954C" opacity="0.6"/>

  <rect x="1142" y="170" width="34" height="170" rx="10" fill="#FFF9E8" stroke="#2B2620" stroke-width="3"/>
  <rect x="1144" y="272" width="30" height="66" rx="5" fill="#E8954C" opacity="0.85"/>
  <line x1="1146" y1="196" x2="1172" y2="196" stroke="#2B2620" stroke-width="2.5"/>
  <line x1="1146" y1="232" x2="1172" y2="232" stroke="#2B2620" stroke-width="2.5"/>
  <line x1="1146" y1="268" x2="1172" y2="268" stroke="#2B2620" stroke-width="2.5"/>
