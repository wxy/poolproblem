  <path d="M1162 116 L1163.6 121.4 L1169 123 L1163.6 124.6 L1162 130 L1160.4 124.6 L1155 123 L1160.4 121.4 Z" fill="#E8954C"/>
  <path d="M996 108 L997.6 113.4 L1003 115 L997.6 116.6 L996 122 L994.4 116.6 L989 115 L994.4 113.4 Z" fill="#E8954C"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="52" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13.5" font-weight="700" letter-spacing="2" fill="#A97A3B">DISK RESERVOIR FOR DEVELOPERS</text>
    <text x="52" y="118" font-size="48" font-weight="850" letter-spacing="-1.2" fill="#2B2620">The Pool Problem</text>
    <rect x="54" y="130" width="210" height="10" rx="5" fill="#F0C75F" opacity="0.9"/>
    <text x="56" y="168" font-size="27" font-weight="700" fill="#B26B24">蓄水池问题</text>
    <text x="56" y="196" font-size="22" font-weight="700" fill="#B26B24">The Cistern Problem for Your Disk</text>
    <text x="56" y="234" font-size="19" font-weight="520" fill="#6B6255">让可用空间，始终稳定在健康水位。</text>
    <text x="56" y="262" font-size="18" fill="#6B6255">Keep free space at a healthy waterline.</text>
    <text x="56" y="296" font-size="14.5" fill="#6B6255">测量每个产废源的流速，预测何时会满，在源头治理。</text>
    <text x="56" y="318" font-size="14.5" fill="#6B6255">Measure the flow, predict the fill, govern at the source.</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <circle cx="64" cy="386" r="9" fill="#E8954C" stroke="#2B2620" stroke-width="3"/>
    <text x="82" y="391" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6F5F">MEASURE</text>
    <line x1="170" y1="386" x2="206" y2="386" stroke="#2B2620" stroke-width="2"/>
    <path d="M204 380 L212 386 L204 392 Z" fill="#2B2620"/>
    <circle cx="224" cy="386" r="9" fill="#E8A24B" stroke="#2B2620" stroke-width="3"/>
    <text x="242" y="391" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6F5F">PREDICT</text>
    <line x1="326" y1="386" x2="362" y2="386" stroke="#2B2620" stroke-width="2"/>
    <path d="M360 380 L368 386 L360 392 Z" fill="#2B2620"/>
    <circle cx="380" cy="386" r="9" fill="#F6C85F" stroke="#2B2620" stroke-width="3"/>
    <text x="398" y="391" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6F5F">GUARD</text>
  </g>
</svg>
