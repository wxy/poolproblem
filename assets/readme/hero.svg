<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">The Pool Problem — 蓄水池问题</title>
  <desc id="heroDesc">浅色 hero：左侧产品名与中英双语标语，右侧蓄水池矢量插画（进水管、水位、量规、出水管）。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="1" stop-color="#F1EBDD"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2B2620" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0C75F" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#F0C75F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F0C75F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D98E2B"/>
      <stop offset="1" stop-color="#F0C75F"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <circle cx="980" cy="252" r="300" fill="url(#warmGlow)"/>
  <line x1="512" y1="44" x2="512" y2="438" stroke="#2B2620" stroke-opacity="0.10"/>

  <circle cx="742" cy="150" r="48" fill="#F0C75F" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="742" cy="150" r="22" fill="#F0C75F" opacity="0.55"/>
  <circle cx="742" cy="150" r="14" fill="#F6C85F" stroke="#2B2620" stroke-width="3.5"/>
  <circle cx="742" cy="150" r="5" fill="#FFF9E8"/>

  <rect x="850" y="150" width="280" height="212" rx="26" fill="#FFF9E8" stroke="#2B2620" stroke-width="4"/>
  <path d="M860 356 L860 276 Q860 250 886 250 L1094 250 Q1120 250 1120 276 L1120 356 Q1120 358 1118 358 L862 358 Q860 358 860 356 Z" fill="url(#waterGrad)"/>
  <path d="M860 254 C878 246 896 262 914 254 C932 246 950 262 968 254 C986 246 1004 262 1022 254 C1040 246 1058 262 1076 254 C1094 246 1108 260 1120 253" fill="none" stroke="#E8954C" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <circle cx="920" cy="320" r="5" fill="#FFF9E8" opacity="0.55"/>
  <circle cx="980" cy="298" r="4" fill="#FFF9E8" opacity="0.55"/>
  <circle cx="1038" cy="330" r="6" fill="#FFF9E8" opacity="0.55"/>

  <line x1="660" y1="176" x2="850" y2="176" stroke="#2B2620" stroke-width="10" stroke-linecap="round"/>
  <path d="M676 170 L684 176 L676 182 Z" fill="#E8954C"/>
  <path d="M700 170 L708 176 L700 182 Z" fill="#E8954C"/>
  <circle cx="726" cy="176" r="15" fill="#F0C75F" stroke="#2B2620" stroke-width="3"/>
  <line x1="717" y1="165" x2="735" y2="187" stroke="#2B2620" stroke-width="3" stroke-linecap="round"/>

  <path d="M985 362 V404 H1180" fill="none" stroke="#2B2620" stroke-width="10" stroke-linecap="round"/>
