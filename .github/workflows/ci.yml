name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Package Tests
        run: swift test

      - name: App Build (Debug, unsigned)
        run: |
          xcodebuild \
            -project PoolProblem/PoolProblem.xcodeproj \
            -scheme PoolProblem \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
